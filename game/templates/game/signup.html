{% extends "game/base.html" %}
{% load static %}

{% block title %}Sign Up — Reward Game{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'game/css/auth.css' %}">
{% endblock %}

{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <img src="{% static 'game/images/logo.png' %}" class="auth-logo" width="70" height="70" alt="Reward Game">

        <h2>Create Account</h2>
        <p class="auth-sub">Start your family reward system</p>

        {% if error %}
            <div class="auth-error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" novalidate>
            {% csrf_token %}
            <input type="text" name="email_confirm" class="hidden" tabindex="-1" autocomplete="off">

            <label class="auth-label">Username</label>
            <input type="text" name="username" required>

            <label class="auth-label">Email</label>
            <input type="email" name="email" required>

            <label class="auth-label">Password</label>
            <div class="password-wrap">
                <input type="password" name="password" id="signup-password" required>
                <button type="button" class="show-pw-btn" onclick="togglePassword('signup-password', this)">👁</button>
            </div>

            <button type="submit">Create Account</button>
        </form>

    </div>

</div>

<script>
function togglePassword(id, btn){
    const input = document.getElementById(id);

    if(input.type === 'password'){
        input.type = 'text';
        btn.textContent = '🙈';
    }else{
        input.type = 'password';
        btn.textContent = '👁';
    }
}
</script>

{% endblock %}
